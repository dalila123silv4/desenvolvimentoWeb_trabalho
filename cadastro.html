<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - DY fitwear</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">
            <h1>DY fitwear</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <div class="login-card">
                <h2>Crie sua conta</h2>
                <p>Preencha os dados abaixo para se cadastrar.</p>

                <form id="cadastroForm">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required placeholder="Seu nome">
                    </div>

                    <div class="input-group">
                        <label for="emailCadastro">E-mail</label>
                        <input type="email" id="emailCadastro" required placeholder="seu@email.com">
                    </div>

                    <div class="input-group">
                        <label for="senhaCadastro">Senha</label>
                        <input type="password" id="senhaCadastro" required placeholder="Mínimo 6 caracteres" minlength="6">
                    </div>

                    <div class="input-group">
                        <label for="senhaConfirmar">Confirmar Senha</label>
                        <input type="password" id="senhaConfirmar" required placeholder="Repita a senha">
                    </div>

                    <div id="msgErrorCadastro" class="msg-error"></div>

                    <button type="submit" class="btn-login">ENTRAR</button>
                </form>

                <div class="register-link">
                    <p>Não tem uma conta? tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom-bar">
            <div class="copyright">
                <p>Copyright ©2025 DY FITWEAR LTDA</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
