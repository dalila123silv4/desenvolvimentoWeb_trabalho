<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - DY fitwear</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">
            <h1>DY fitwear</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <div class="login-card">
                <h2>Esqueceu a senha?</h2>
                <p>Digite seu e-mail abaixo e enviaremos um link para você redefinir sua senha.</p>

                <form id="recuperarForm">
                    <div class="input-group">
                        <label for="emailRecuperar">E-mail cadastrado</label>
                        <input type="email" id="emailRecuperar" required placeholder="seu@email.com">
                    </div>

                    <button type="submit" class="btn-login">ENVIAR LINK</button>
                </form>

                <div class="register-link">
                    <p><a href="login.html">Voltar para Login</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom-bar">
            <div class="copyright">
                <p>Copyright ©2025 DY FITWEAR LTDA</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
